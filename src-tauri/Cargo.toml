[package]
name = "seda"
version = "0.1.0"
description = "Seda: private voice typing and meeting notes for Windows"
authors = ["d1same"]
license = "MIT"
repository = "https://github.com/d1same/seda"
edition = "2024"

[lib]
name = "seda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
cpal = "0.15"
whisper-rs = { version = "0.16", features = ["vulkan"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
arboard = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
hound = "3.5"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_Graphics_Gdi",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_System_Registry",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
