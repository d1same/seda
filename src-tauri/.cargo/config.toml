# Build settings for Windows. Adjust the paths below to where these tools are installed on your PC.
[build]
# Short name on purpose. Z:/Projects/Whisper/build made the Vulkan shader paths
# longer than Windows allows, so the compiler output is this one-letter folder.
target-dir = "Z:/Projects/Whisper/b"

[env]
VULKAN_SDK = "C:\\VulkanSDK\\1.4.363.0"
CMAKE = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\Common7\\IDE\\CommonExtensions\\Microsoft\\CMake\\CMake\\bin\\cmake.exe"
LIBCLANG_PATH = "C:\\Program Files\\LLVM\\bin"
# MSBuild's file tracker still dies on the Vulkan try-compile path (FTK1011)
# even in this short folder. Turning tracking off is the fix whisper-rs documents.
# /FS stops the parallel compile from fighting over one .pdb once tracking is off.
TrackFileAccess = "false"
CMAKE_C_FLAGS = "/FS /DWIN32 /D_WINDOWS"
CMAKE_CXX_FLAGS = "/FS /DWIN32 /D_WINDOWS /GR /EHsc"